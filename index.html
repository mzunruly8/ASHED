
<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>ASHED</title> <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet"> <style> :root { --red: #ff2d55; --blue: #00aaff; --green: #00ff99; --yellow: #ffd200; --bg: #060a12; --panel: rgba(8,14,28,0.9); --border: rgba(255,255,255,0.07); } * { box-sizing:border-box; margin:0; padding:0; } html,body { width:100%; height:100%; overflow:hidden; } body { background:var(--bg); color:#e0e8ff; font-family:'IBM Plex Mono',monospace; height:100dvh; touch-action:none; position:relative; display:flex; align-items:center; justify-content:center; } body::before { content:''; position:fixed; inset:0; background: radial-gradient(ellipse 60% 40% at 50% 0%,rgba(0,160,255,0.08) 0%,transparent 70%), radial-gradient(ellipse 50% 30% at 50% 100%,rgba(255,45,85,0.06) 0%,transparent 70%); pointer-events:none; z-index:0; } body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.12) 2px,rgba(0,0,0,0.12) 4px); pointer-events:none; z-index:999; } /* SCREENS */ .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:10; padding:14px; } .screen.active { display:flex; } /* START */ #start-screen { gap:40px; text-align:center; } .logo { position:relative; width:100%; display:flex; flex-direction:column; align-items:center; } .logo h1 { font-family:'Bebas Neue',sans-serif; font-size:min(22vw,110px); letter-spacing:0.15em; color:#fff; line-height:1; position:relative; text-shadow:0 0 40px rgba(0,170,255,0.5),0 0 80px rgba(0,170,255,0.2); width:100%; text-align:center; } .logo h1::before,.logo h1::after { content:'ASHED'; position:absolute; inset:0; font-family:'Bebas Neue',sans-serif; font-size:inherit; letter-spacing:inherit; text-align:center; } .logo h1::before { color:var(--red); animation:glitch-r 3s infinite; clip-path:polygon(0 30%,100% 30%,100% 50%,0 50%); } .logo h1::after { color:var(--blue); animation:glitch-b 3s infinite 0.1s; clip-path:polygon(0 60%,100% 60%,100% 75%,0 75%); } @keyframes glitch-r { 0%,90%,100%{transform:translateX(0);opacity:0} 92%{transform:translateX(-4px);opacity:.8} 94%{transform:translateX(3px);opacity:.6} 96%{transform:translateX(0);opacity:0} } @keyframes glitch-b { 0%,88%,100%{transform:translateX(0);opacity:0} 90%{transform:translateX(4px);opacity:.7} 93%{transform:translateX(-2px);opacity:.5} 95%{transform:translateX(0);opacity:0} } .logo p { font-size:9px; letter-spacing:.5em; color:rgba(0,170,255,.5); margin-top:10px; text-transform:uppercase; } .btn-main { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:.3em; color:#fff; background:transparent; border:1px solid rgba(0,170,255,.5); padding:14px 60px; cursor:pointer; position:relative; overflow:hidden; clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%); transition:all .2s; } .btn-main::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(0,170,255,.15),transparent); transform:translateX(-100%); animation:shimmer 2s infinite; } @keyframes shimmer { 100%{transform:translateX(100%)} } .btn-main:active { transform:scale(.95); background:rgba(0,170,255,.1); } /* BATTLE */ #battle-screen { justify-content:space-between; padding:10px 12px; gap:8px; } .panel { width:100%; max-width:440px; background:var(--panel); border:1px solid var(--border); padding:10px 12px; position:relative; overflow:hidden; } .panel.enemy { border-left:3px solid var(--red); } .panel.enemy::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,45,85,.04) 0%,transparent 60%); pointer-events:none; } .panel.player { border-right:3px solid var(--blue); } .panel.player::after { content:''; position:absolute; inset:0; background:linear-gradient(225deg,rgba(0,170,255,.04) 0%,transparent 60%); pointer-events:none; } .panel-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; } .enemy-name { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.08em; color:var(--red); text-shadow:0 0 20px rgba(255,45,85,.4); } .meta { font-size:9px; color:rgba(255,255,255,.3); letter-spacing:.2em; } .hp-track { height:5px; background:rgba(255,255,255,.05); overflow:hidden; } .hp-fill { height:100%; transition:width .4s cubic-bezier(.4,0,.2,1); position:relative; } .hp-fill::after { content:''; position:absolute; right:0; top:0; bottom:0; width:3px; background:rgba(255,255,255,.5); filter:blur(1px); } .hp-fill.e { background:linear-gradient(90deg,#900,var(--red)); } .hp-fill.p { background:linear-gradient(90deg,#005,var(--blue)); } .hp-labels { display:flex; justify-content:space-between; margin-top:4px; font-size:9px; color:rgba(255,255,255,.3); letter-spacing:.1em; } .burst { color:var(--red); font-weight:700; } /* GRID */ .grid-wrap { position:relative; width:100%; max-width:440px; aspect-ratio:1; background:rgba(4,8,20,.95); border:1px solid var(--border); flex-shrink:0; } .grid-wrap::before { content:''; position:absolute; inset:0; background:linear-gradient(rgba(0,170,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,170,255,.025) 1px,transparent 1px); background-size:14.285% 14.285%; pointer-events:none; z-index:0; } #grid-container { position:absolute; inset:3px; display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(7,1fr); gap:2px; } .tile { background:rgba(10,18,36,.8); border:1px solid rgba(255,255,255,.04); display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; border-radius:2px; transition:transform .1s,opacity .15s; } .gem { width:58%; height:58%; border-radius:3px; position:relative; transition:all .15s cubic-bezier(.34,1.56,.64,1); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:10px; letter-spacing:.05em; color:rgba(0,0,0,.65); } .gem::before { content:''; position:absolute; top:1px; left:1px; right:1px; height:38%; background:rgba(255,255,255,.28); border-radius:2px 2px 50% 50%; } .gem.red { background:var(--red); box-shadow:0 0 8px rgba(255,45,85,.5); } .gem.blue { background:var(--blue); box-shadow:0 0 8px rgba(0,170,255,.5); } .gem.green { background:var(--green); box-shadow:0 0 8px rgba(0,255,153,.5); } .gem.yellow { background:var(--yellow); box-shadow:0 0 8px rgba(255,210,0,.5); } .tile.selected { transform:scale(.85); border-color:rgba(255,255,255,.2); background:rgba(255,255,255,.04); } .tile.selected .gem { width:78%; height:78%; } .tile.selected .gem.red { box-shadow:0 0 18px rgba(255,45,85,.9), 0 0 35px rgba(255,45,85,.3); } .tile.selected .gem.blue { box-shadow:0 0 18px rgba(0,170,255,.9), 0 0 35px rgba(0,170,255,.3); } .tile.selected .gem.green { box-shadow:0 0 18px rgba(0,255,153,.9), 0 0 35px rgba(0,255,153,.3); } .tile.selected .gem.yellow { box-shadow:0 0 18px rgba(255,210,0,.9), 0 0 35px rgba(255,210,0,.3); } .tile.removing { animation:pop .18s ease-out forwards; } @keyframes pop { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.2);opacity:.4} 100%{transform:scale(0);opacity:0} } #connectionCanvas { position:absolute; inset:0; pointer-events:none; z-index:5; width:100%; height:100%; } /* LEGEND */ .legend { display:flex; gap:10px; justify-content:center; width:100%; max-width:440px; } .legend-item { display:flex; align-items:center; gap:4px; font-size:8px; letter-spacing:.15em; color:rgba(255,255,255,.3); text-transform:uppercase; } .legend-dot { width:6px; height:6px; border-radius:1px; } /* PLAYER PANEL */ .status-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; } .status-label { font-size:9px; letter-spacing:.25em; color:rgba(0,170,255,.6); text-transform:uppercase; } .hp-text { font-size:9px; color:rgba(255,255,255,.3); } .stat-row { display:flex; gap:8px; margin:8px 0; } .stat-box { flex:1; background:rgba(0,0,0,.35); border:1px solid var(--border); padding:5px 8px; text-align:center; } .stat-val { font-family:'Bebas Neue',sans-serif; font-size:20px; line-height:1; } .stat-val.en { color:var(--yellow); text-shadow:0 0 12px rgba(255,210,0,.4); } .stat-val.sh { color:var(--blue); text-shadow:0 0 12px rgba(0,170,255,.4); } .stat-lbl { font-size:7px; letter-spacing:.2em; color:rgba(255,255,255,.2); margin-top:1px; } .skills-row { display:grid; grid-template-columns:1fr 1fr; gap:6px; } .skill-btn { background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.07); color:rgba(255,255,255,.2); font-family:'IBM Plex Mono',monospace; font-size:8px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:8px 5px; cursor:pointer; transition:all .2s; } .skill-btn .skill-name { display:block; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:.05em; line-height:1; margin-bottom:2px; } .skill-btn.ready-atk { border-color:rgba(255,45,85,.5); color:#fff; background:rgba(255,45,85,.1); box-shadow:0 0 16px rgba(255,45,85,.2); } .skill-btn.ready-atk:active { transform:scale(.95); } .skill-btn.ready-heal { border-color:rgba(0,255,153,.5); color:#fff; background:rgba(0,255,153,.08); box-shadow:0 0 16px rgba(0,255,153,.2); } .skill-btn.ready-heal:active { transform:scale(.95); } /* FLOAT */ .float-txt { position:fixed; pointer-events:none; font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:.05em; z-index:500; animation:floatUp .9s ease-out forwards; text-shadow:0 2px 10px rgba(0,0,0,.8); transform:translateX(-50%); } @keyframes floatUp { 0%{transform:translate(-50%,0) scale(1);opacity:1} 20%{transform:translate(-50%,-12px) scale(1.1);opacity:1} 100%{transform:translate(-50%,-65px) scale(.9);opacity:0} } /* FLASH */ #flash { position:fixed; inset:0; pointer-events:none; z-index:200; opacity:0; transition:opacity .08s; } #flash.on { opacity:.22; } /* SHAKE */ @keyframes shake { 0%,100%{transform:translate(0)} 15%{transform:translate(-5px,2px)} 30%{transform:translate(4px,-3px)} 45%{transform:translate(-4px,3px)} 60%{transform:translate(3px,-2px)} 75%{transform:translate(-2px,2px)} } body.shake { animation:shake .38s cubic-bezier(.36,.07,.19,.97) both; } /* END */ #end-screen { gap:36px; text-align:center; } .end-title { font-family:'Bebas Neue',sans-serif; font-size:min(18vw,90px); letter-spacing:.1em; line-height:1; } .end-title.win { color:var(--blue); text-shadow:0 0 50px rgba(0,170,255,.6); } .end-title.lose { color:var(--red); text-shadow:0 0 50px rgba(255,45,85,.6); } .btn-reboot { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.3em; color:#000; background:#fff; border:none; padding:13px 52px; cursor:pointer; clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%); transition:all .15s; } .btn-reboot:active { transform:scale(.95); } /* TUTORIAL OVERLAY */ #tutorial-overlay { position:fixed; inset:0; z-index:800; pointer-events:none; display:none; } #tutorial-overlay.active { display:block; } .tut-backdrop { position:absolute; inset:0; background:rgba(0,0,0,.75); pointer-events:all; } .tut-box { position:absolute; background:rgba(5,9,18,.97); border:1px solid rgba(0,170,255,.35); padding:16px; max-width:270px; pointer-events:all; box-shadow:0 0 30px rgba(0,170,255,.15); } .tut-box.arrow-up::before { content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%); border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:8px solid rgba(0,170,255,.4); } .tut-box.arrow-down::before{ content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); border-left:8px solid transparent; border-right:8px solid transparent; border-top:8px solid rgba(0,170,255,.4); } .tut-step { font-size:8px; letter-spacing:.3em; color:rgba(0,170,255,.5); text-transform:uppercase; margin-bottom:5px; } .tut-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.08em; color:#fff; margin-bottom:5px; } .tut-body { font-size:10px; line-height:1.65; color:rgba(255,255,255,.5); margin-bottom:10px; } .tut-gems { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; } .tut-gem { display:flex; align-items:center; gap:7px; font-size:9px; color:rgba(255,255,255,.5); letter-spacing:.08em; } .tut-gem-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; } .tut-next { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:.2em; color:#000; background:var(--blue); border:none; padding:8px 20px; cursor:pointer; width:100%; transition:all .15s; } .tut-next:active { transform:scale(.97); } .tut-skip { font-size:8px; letter-spacing:.2em; color:rgba(255,255,255,.2); background:none; border:none; cursor:pointer; margin-top:6px; width:100%; text-transform:uppercase; padding:3px; } .tut-skip:active { color:rgba(255,255,255,.5); } .tut-ring { position:absolute; border:2px solid rgba(0,170,255,.7); border-radius:4px; box-shadow:0 0 20px rgba(0,170,255,.3),inset 0 0 10px rgba(0,170,255,.05); pointer-events:none; animation:pulse-ring 1.5s ease-in-out infinite; display:none; } @keyframes pulse-ring { 0%,100%{box-shadow:0 0 20px rgba(0,170,255,.3),inset 0 0 10px rgba(0,170,255,.05)} 50%{box-shadow:0 0 35px rgba(0,170,255,.6),inset 0 0 15px rgba(0,170,255,.1)} } </style> </head> <body> <div id="flash"></div> <!-- Tutorial Overlay --> <div id="tutorial-overlay"> <div class="tut-backdrop"></div> <div class="tut-ring" id="tut-ring"></div> <div class="tut-box" id="tut-box"> <div class="tut-step" id="tut-step">STEP 1 / 3</div> <div class="tut-title" id="tut-title">HOW TO PLAY</div> <div class="tut-body" id="tut-body"></div> <div class="tut-gems" id="tut-gems"></div> <button class="tut-next" id="tut-next" onclick="tutNext()">GOT IT →</button> <button class="tut-skip" onclick="dismissTutorial()">SKIP TUTORIAL</button> </div> </div> <!-- Start Screen --> <div id="start-screen" class="screen active"> <div class="logo"> <h1>ASHED</h1> <p>UNRULY CORE ENGINE</p> </div> <button class="btn-main" onclick="startGame()">INITIATE</button> </div> <!-- Battle Screen --> <div id="battle-screen" class="screen"> <div class="panel enemy"> <div class="panel-header"> <span class="enemy-name" id="enemy-name">Void Weaver</span> <span class="meta">LVL <span id="enemy-level">1</span></span> </div> <div class="hp-track"><div class="hp-fill e" id="enemy-hp-bar" style="width:100%"></div></div> <div class="hp-labels"> <span id="enemy-hp-text">150 / 150</span> <span>BURST IN <span class="burst" id="enemy-timer">3</span></span> </div> </div> <div class="grid-wrap"> <canvas id="connectionCanvas"></canvas> <div id="grid-container"></div> </div> <div class="legend"> <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>ATK</div> <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>SHIELD</div> <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>HEAL</div> <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>CORE</div> </div> <div class="panel player"> <div class="status-row"> <span class="status-label">SYSTEM — LV <span id="player-level">1</span></span> <span class="hp-text" id="player-hp-text">80 / 80</span> </div> <div class="hp-track"><div class="hp-fill p" id="player-hp-bar" style="width:100%"></div></div> <div class="stat-row"> <div class="stat-box"> <div class="stat-val en" id="player-energy">0</div> <div class="stat-lbl">CORE ENERGY</div> </div> <div class="stat-box"> <div class="stat-val sh" id="player-def">0</div> <div class="stat-lbl">SHIELD</div> </div> </div> <div class="skills-row"> <button class="skill-btn" id="skill-1" onclick="useSkill(0)"> <span class="skill-name">SMITE</span>15 CORE · BIG DAMAGE </button> <button class="skill-btn" id="skill-2" onclick="useSkill(1)"> <span class="skill-name">REBOOT</span>10 CORE · RESTORE HP </button> </div> </div> </div> <!-- End Screen --> <div id="end-screen" class="screen"> <div class="end-title" id="end-title">VICTORY</div> <button class="btn-reboot" onclick="restartGame()">REBOOT</button> </div> <script> const GRID = 7; const TYPES = ['red','blue','green','yellow']; const COLORS = { red:'#ff2d55', blue:'#00aaff', green:'#00ff99', yellow:'#ffd200' }; const LABELS = { red:'ATK', blue:'DEF', green:'HP', yellow:'EN' }; const ENEMY_NAMES = ['Void Weaver','Null Specter','Hex Driver','Corrupt Node','Dark Cipher','Phantom Core','Shadow Pulse','Chaos Engine']; function freshState() { return { player: { hp:80, maxHp:80, level:1, energy:0, def:0 }, enemy: { hp:150, maxHp:150, level:1, timer:3, maxTimer:3, atk:18, name:ENEMY_NAMES[0] }, grid:[], isDragging:false, selectedTiles:[], isProcessing:false }; } let state = freshState(); const gridEl = document.getElementById('grid-container'); const canvas = document.getElementById('connectionCanvas'); function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); } /* ── START ── */ function startGame() { state = freshState(); showScreen('battle-screen'); buildGrid(); updateUI(); resizeCanvas(); showTutorial(); } /* ── TUTORIAL ── */ const TUT_STEPS = [ { title: 'CONNECT THE GEMS', body: 'Drag across 3 or more gems of the SAME colour. They must be touching — including diagonally. Release to activate.', gems: null, target: 'grid' }, { title: 'COLOUR = ACTION', body: 'Every colour triggers a different effect when matched:', gems: [ { color:'#ff2d55', label:'RED — Deals damage to the enemy' }, { color:'#00aaff', label:'BLUE — Raises your shield' }, { color:'#00ff99', label:'GREEN — Recovers your health' }, { color:'#ffd200', label:'YELLOW — Charges core energy' } ], target: 'legend' }, { title: 'WATCH THE BURST', body: 'The enemy attacks every 3 turns. Shield absorbs hits. Charge energy to unlock your SMITE and REBOOT skills.', gems: null, target: 'enemy' } ]; let tutStep = 0; function showTutorial() { tutStep = 0; renderTutStep(); document.getElementById('tutorial-overlay').classList.add('active'); } function renderTutStep() { const s = TUT_STEPS[tutStep]; document.getElementById('tut-step').textContent = `STEP ${tutStep+1} / ${TUT_STEPS.length}`; document.getElementById('tut-title').textContent = s.title; document.getElementById('tut-body').textContent = s.body; document.getElementById('tut-next').textContent = tutStep < TUT_STEPS.length - 1 ? 'GOT IT →' : 'START BATTLE'; const gemsEl = document.getElementById('tut-gems'); gemsEl.innerHTML = ''; if (s.gems) { s.gems.forEach(g => { const row = document.createElement('div'); row.className = 'tut-gem'; row.innerHTML = `<div class="tut-gem-dot" style="background:${g.color}"></div>${g.label}`; gemsEl.appendChild(row); }); } positionTut(s.target); } function positionTut(target) { const box = document.getElementById('tut-box'); const ring = document.getElementById('tut-ring'); const vw = window.innerWidth; const vh = window.innerHeight; let refEl = null; if (target === 'grid') refEl = document.querySelector('.grid-wrap'); if (target === 'legend') refEl = document.querySelector('.legend'); if (target === 'enemy') refEl = document.querySelector('.panel.enemy'); box.className = 'tut-box'; box.style.transform = ''; if (refEl) { const r = refEl.getBoundingClientRect(); ring.style.display = 'block'; ring.style.left = (r.left - 4) + 'px'; ring.style.top = (r.top - 4) + 'px'; ring.style.width = (r.width + 8) + 'px'; ring.style.height = (r.height + 8) + 'px'; const boxW = Math.min(270, vw - 20); const spaceBelow = vh - r.bottom; if (spaceBelow > 240) { box.style.top = (r.bottom + 14) + 'px'; box.classList.add('arrow-up'); } else { box.style.top = Math.max(10, r.top - 14) + 'px'; box.style.transform = 'translateY(-100%)'; box.classList.add('arrow-down'); } let left = r.left + r.width/2 - boxW/2; left = Math.max(10, Math.min(left, vw - boxW - 10)); box.style.left = left + 'px'; box.style.width = boxW + 'px'; } else { ring.style.display = 'none'; box.style.top = '50%'; box.style.left = '50%'; box.style.transform = 'translate(-50%,-50%)'; box.style.width = Math.min(270, vw - 20) + 'px'; } } function tutNext() { tutStep++; if (tutStep >= TUT_STEPS.length) dismissTutorial(); else renderTutStep(); } function dismissTutorial() { document.getElementById('tutorial-overlay').classList.remove('active'); document.getElementById('tut-ring').style.display = 'none'; } /* ── GRID ── */ function buildGrid() { gridEl.innerHTML = ''; state.grid = []; for (let r = 0; r < GRID; r++) { state.grid[r] = []; for (let c = 0; c < GRID; c++) makeTile(r, c); } } function makeTile(r, c, type) { type = type || TYPES[Math.floor(Math.random() * TYPES.length)]; const tile = document.createElement('div'); tile.className = 'tile'; tile.dataset.row = r; tile.dataset.col = c; tile.dataset.type = type; const gem = document.createElement('div'); gem.className = `gem ${type}`; gem.textContent = LABELS[type]; tile.appendChild(gem); tile.addEventListener('mousedown', () => startDrag(r, c)); tile.addEventListener('touchstart', (e) => { e.preventDefault(); startDrag(r, c); }, { passive:false }); gridEl.appendChild(tile); state.grid[r][c] = { type, el:tile }; } /* ── DRAG ── */ window.addEventListener('mousemove', e => { if (!state?.isDragging) return; const tile = e.target.closest?.('.tile'); if (tile) continueDrag(+tile.dataset.row, +tile.dataset.col); }); window.addEventListener('touchmove', e => { if (!state?.isDragging) return; const t = e.touches[0]; const el = document.elementFromPoint(t.clientX, t.clientY); const tile = el?.closest?.('.tile'); if (tile) continueDrag(+tile.dataset.row, +tile.dataset.col); }, { passive:false }); window.addEventListener('mouseup', endDrag); window.addEventListener('touchend', endDrag); function startDrag(r, c) { if (state.isProcessing) return; state.isDragging = true; state.selectedTiles = [{ r, c }]; state.grid[r][c].el.classList.add('selected'); drawLines(); } function continueDrag(r, c) { if (!state.isDragging || state.isProcessing) return; const sel = state.selectedTiles; const last = sel[sel.length - 1]; if (sel.length > 1) { const prev = sel[sel.length - 2]; if (prev.r === r && prev.c === c) { state.grid[last.r][last.c].el.classList.remove('selected'); sel.pop(); drawLines(); return; } } if (last.r === r && last.c === c) return; const isAdj = Math.abs(last.r - r) <= 1 && Math.abs(last.c - c) <= 1; const isSame = state.grid[r][c].type === state.grid[last.r][last.c].type; const isNew = !sel.some(t => t.r === r && t.c === c); if (isAdj && isSame && isNew) { sel.push({ r, c }); state.grid[r][c].el.classList.add('selected'); drawLines(); } } async function endDrag() { if (!state?.isDragging) return; state.isDragging = false; if (state.selectedTiles.length >= 3) { await processMatch(); } else { state.selectedTiles.forEach(t => state.grid[t.r][t.c].el.classList.remove('selected')); state.selectedTiles = []; clearLines(); } } /* ── MATCH ── */ async function processMatch() { state.isProcessing = true; const count = state.selectedTiles.length; const type = state.grid[state.selectedTiles[0].r][state.selectedTiles[0].c].type; switch (type) { case 'red': dealDamage(count * 7); break; case 'blue': { const sh = count*4; state.player.def += sh; showFloat(`SHIELD +${sh}`, COLORS.blue); break; } case 'green': { const hp = count*5; state.player.hp = Math.min(state.player.maxHp, state.player.hp + hp); showFloat(`HEAL +${hp}`, COLORS.green); break; } case 'yellow': { const en = count*3; state.player.energy += en; showFloat(`CORE +${en}`, COLORS.yellow); break; } } state.selectedTiles.forEach(t => state.grid[t.r][t.c].el.classList.add('removing')); clearLines(); await delay(200); dropAndFill(); state.selectedTiles = []; state.enemy.timer--; if (state.enemy.timer <= 0) { await delay(100); await enemyAttack(); state.enemy.timer = state.enemy.maxTimer; } state.isProcessing = false; updateUI(); if (state.player.hp <= 0) { showEnd(false); return; } if (state.enemy.hp <= 0) handleVictory(); } function dropAndFill() { const removed = new Set(state.selectedTiles.map(t => `${t.r},${t.c}`)); for (let c = 0; c < GRID; c++) { const survivors = []; for (let r = GRID-1; r >= 0; r--) { if (!removed.has(`${r},${c}`)) survivors.push(state.grid[r][c].type); } let wr = GRID-1; for (const type of survivors) { rebuildCell(wr, c, type); wr--; } while (wr >= 0) { rebuildCell(wr, c, null); wr--; } } } function rebuildCell(r, c, type) { if (state.grid[r]?.[c]?.el) state.grid[r][c].el.remove(); if (!state.grid[r]) state.grid[r] = []; makeTile(r, c, type); } /* ── COMBAT ── */ function dealDamage(amount) { state.enemy.hp = Math.max(0, state.enemy.hp - amount); showFloat(`-${amount}`, COLORS.red, true); doFlash(COLORS.red); } async function enemyAttack() { const hit = Math.max(1, state.enemy.atk - state.player.def); state.player.def = 0; state.player.hp = Math.max(0, state.player.hp - hit); showFloat(`HIT -${hit}`, '#ffffff'); doFlash('#ffffff'); document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 400); updateUI(); await delay(320); } function doFlash(color) { const f = document.getElementById('flash'); f.style.background = color; f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 100); } /* ── LEVEL ── */ function handleVictory() { state.player.level++; state.player.maxHp += 30; state.player.hp = state.player.maxHp; state.enemy.level++; state.enemy.maxHp += 80; state.enemy.hp = state.enemy.maxHp; state.enemy.atk += 8; state.enemy.name = ENEMY_NAMES[Math.min(state.enemy.level-1, ENEMY_NAMES.length-1)]; state.enemy.maxTimer = Math.max(2, state.enemy.maxTimer - (state.enemy.level % 3 === 0 ? 1 : 0)); state.enemy.timer = state.enemy.maxTimer; showFloat('LEVEL UP', COLORS.blue); updateUI(); } /* ── SKILLS ── */ function useSkill(idx) { if (state.isProcessing) return; if (idx === 0 && state.player.energy >= 15) { state.player.energy -= 15; dealDamage(60 + state.player.level * 15); updateUI(); if (state.enemy.hp <= 0) handleVictory(); } else if (idx === 1 && state.player.energy >= 10) { state.player.energy -= 10; const h = 50 + state.player.level * 10; state.player.hp = Math.min(state.player.maxHp, state.player.hp + h); showFloat(`REBOOT +${h}`, COLORS.green); updateUI(); } } /* ── UI ── */ function updateUI() { const eHp = Math.max(0, state.enemy.hp); const pHp = Math.max(0, state.player.hp); document.getElementById('enemy-hp-bar').style.width = (eHp/state.enemy.maxHp*100)+'%'; document.getElementById('enemy-hp-text').textContent = `${Math.ceil(eHp)} / ${state.enemy.maxHp}`; document.getElementById('enemy-timer').textContent = state.enemy.timer; document.getElementById('enemy-level').textContent = state.enemy.level; document.getElementById('enemy-name').textContent = state.enemy.name; document.getElementById('player-hp-bar').style.width = (pHp/state.player.maxHp*100)+'%'; document.getElementById('player-hp-text').textContent = `${Math.ceil(pHp)} / ${state.player.maxHp}`; document.getElementById('player-energy').textContent = state.player.energy; document.getElementById('player-def').textContent = state.player.def; document.getElementById('player-level').textContent = state.player.level; const s1 = document.getElementById('skill-1'); const s2 = document.getElementById('skill-2'); s1.className = state.player.energy >= 15 ? 'skill-btn ready-atk' : 'skill-btn'; s2.className = state.player.energy >= 10 ? 'skill-btn ready-heal' : 'skill-btn'; } /* ── CANVAS ── */ function resizeCanvas() { const wrap = document.querySelector('.grid-wrap'); if (!wrap) return; const r = wrap.getBoundingClientRect(); canvas.width = r.width; canvas.height = r.height; drawLines(); } function clearLines() { canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); } function drawLines() { const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); if (!state?.selectedTiles || state.selectedTiles.length < 2) return; const type = state.grid[state.selectedTiles[0].r][state.selectedTiles[0].c].type; const color = COLORS[type]; const wrap = document.querySelector('.grid-wrap'); const wr = wrap.getBoundingClientRect(); ctx.beginPath(); ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=color; ctx.shadowBlur=14; ctx.shadowColor=color; state.selectedTiles.forEach((p,i) => { const el=state.grid[p.r][p.c].el; const r=el.getBoundingClientRect(); const x=r.left-wr.left+r.width/2; const y=r.top-wr.top+r.height/2; i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }); ctx.stroke(); } /* ── FLOAT ── */ function showFloat(text, color, isEnemy=false) { const d=document.createElement('div'); d.className='float-txt'; d.textContent=text; d.style.color=color; d.style.left='50%'; d.style.top=isEnemy?'16%':'70%'; document.body.appendChild(d); setTimeout(()=>d.remove(),900); } /* ── END ── */ function showEnd(win) { showScreen('end-screen'); const t=document.getElementById('end-title'); t.textContent=win?'VICTORY':'CRITICAL\nFAILURE'; t.className=`end-title ${win?'win':'lose'}`; } function restartGame() { location.reload(); } const delay = ms => new Promise(r => setTimeout(r, ms)); window.addEventListener('resize', () => { resizeCanvas(); if (document.getElementById('tutorial-overlay').classList.contains('active')) renderTutStep(); }); setTimeout(resizeCanvas, 80); </script> </body> </html>
